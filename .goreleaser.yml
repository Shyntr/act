version: 2
before:
  hooks:
    - go mod tidy

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  groups:
    - title: 'New Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug Fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Shyntr Changes'
      regexp: "^.*shyntr[(\\w)]*:+.*$"
      order: 2
    - title: 'Upstream Sync'
      regexp: "^.*upstream[(\\w)]*:+.*$"
      order: 3
    - title: 'Other'
      order: 999
release:
  prerelease: auto
  mode: append
  name_template: "shyntr-ops/act {{.Tag}}"
  header: |
    ## shyntr-ops/act {{.Tag}}

    Fork of [nektos/act](https://github.com/nektos/act) —
    modified for use as execution engine in [Shyntr Ops](https://github.com/shyntr/shyntr-ops).

    ### Upstream
    Tracks nektos/act releases via `nektos/master` branch.
